<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Выбей скидку!</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        video, canvas {
            max-width: none !important;
            height: auto !important;
            min-width: 0 !important;
            min-height: 0 !important;
        }

        /* Полноэкранный слой для UI */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            overflow: hidden; 
        }
        
        .interactive { pointer-events: auto; }
        

        #example-scanning-overlay { display: none; }
    </style>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; background-color: black;">


    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>


        <a-entity mindar-image-target="targetIndex: 0">
            

            <a-entity position="0 0.3 0" scale="0.9 0.9 0.9">
                

                <a-cylinder color="#1f2937" radius="0.05" height="1.2" position="0 -0.5 -0.1"></a-cylinder>
                
                <a-triangle color="#ef4444" vertex-a="0 0.1 0" vertex-b="-0.08 -0.1 0" vertex-c="0.08 -0.1 0" position="0 0.55 0.05" rotation="0 0 180"></a-triangle>

                <a-entity id="roulette" animation="property: rotation; to: 0 0 -360; loop: true; dur: 2000; easing: linear">
                    
                    <a-cylinder color="#ef4444" radius="0.52" height="0.04" rotation="90 0 0"></a-cylinder>
                    <a-cylinder color="#ffffff" radius="0.48" height="0.05" rotation="90 0 0"></a-cylinder>
                    
                    
                    <a-text value="500" color="#111827" align="center" position="0 0.32 0.03" scale="0.6 0.6 0.6"></a-text>
                    <a-text value="15%" color="#111827" align="center" position="0.32 0 0.03" rotation="0 0 -90" scale="0.6 0.6 0.6"></a-text>
                    <a-text value="5%" color="#111827" align="center" position="0 -0.32 0.03" rotation="0 0 -180" scale="0.6 0.6 0.6"></a-text>
                    <a-text value="20%" color="#111827" align="center" position="-0.32 0 0.03" rotation="0 0 90" scale="0.6 0.6 0.6"></a-text>
                    

                    <a-cylinder color="#111827" radius="0.08" height="0.08" rotation="90 0 0"></a-cylinder>

                </a-entity>
            </a-entity>
            
        </a-entity>
    </a-scene
