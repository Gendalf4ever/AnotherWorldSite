<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Выбей скидку!</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        video, canvas {
            max-width: none !important;
            height: auto !important;
            min-width: 0 !important;
            min-height: 0 !important;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            overflow: hidden; 
        }
        
        .interactive { pointer-events: auto; }
        #example-scanning-overlay { display: none; }
    </style>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; background-color: black;">

    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity position="0 0.3 0" scale="0.9 0.9 0.9">
                <a-cylinder color="#1f2937" radius="0.05" height="1.2" position="0 -0.5 -0.1"></a-cylinder>
                <a-triangle color="#ef4444" vertex-a="0 0.1 0" vertex-b="-0.08 -0.1 0" vertex-c="0.08 -0.1 0" position="0 0.55 0.05" rotation="0 0 180"></a-triangle>

                <a-entity id="roulette" animation="property: rotation; to: 0 0 -360; loop: true; dur: 2000; easing: linear">
                    <a-cylinder color="#ef4444" radius="0.52" height="0.04" rotation="90 0 0"></a-cylinder>
                    <a-cylinder color="#ffffff" radius="0.48" height="0.05" rotation="90 0 0"></a-cylinder>
                    
                    <a-text value="500" color="#111827" align="center" position="0 0.32 0.03" scale="0.6 0.6 0.6"></a-text>
                    <a-text value="15%" color="#111827" align="center" position="0.32 0 0.03" rotation="0 0 -90" scale="0.6 0.6 0.6"></a-text>
                    <a-text value="5%" color="#111827" align="center" position="0 -0.32 0.03" rotation="0 0 -180" scale="0.6 0.6 0.6"></a-text>
                    <a-text value="20%" color="#111827" align="center" position="-0.32 0 0.03" rotation="0 0 90" scale="0.6 0.6 0.6"></a-text>
                    
                    <a-cylinder color="#111827" radius="0.08" height="0.08" rotation="90 0 0"></a-cylinder>
                </a-entity>
            </a-entity>
        </a-entity>
    </a-scene>   

    <div id="ui-layer">
        <img id="doom-weapon" src="models/gun.png" alt="Оружие" class="absolute bottom-0 left-1/2 transform -translate-x-1/2 h-[40vh] md:h-[50vh] object-contain transition-transform duration-75 origin-bottom-right z-0">
        
        <button id="shoot-btn" class="interactive z-10 bg-red-600 text-white font-bold text-2xl py-4 px-12 rounded-full shadow-[0_0_20px_rgba(239,68,68,0.8)] border-4 border-white transform transition-transform active:scale-95 mb-8">
            Стрелять
        </button>
    
        <div id="result-popup" class="interactive hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-[#1e2126] border-2 border-red-500 rounded-3xl p-8 text-center w-11/12 max-w-sm shadow-2xl z-20">
            <h2 class="text-3xl font-black text-white mb-2 uppercase">Твоя скидка:</h2>
            <div id="prize-text" class="text-5xl font-black text-red-500 mb-6 drop-shadow-[0_0_10px_rgba(239,68,68,0.5)]"></div>
            <p class="text-gray-300 mb-6">Покажи этот экран администратору при оплате!</p>
            <button onclick="location.href='index.html'" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-xl w-full uppercase shadow-lg">На главную</button>
        </div>
    </div>

        <script>
        const shootBtn = document.getElementById('shoot-btn');
        const roulette = document.getElementById('roulette');
        const resultPopup = document.getElementById('result-popup');
        const prizeText = document.getElementById('prize-text');
        const weapon = document.getElementById('doom-weapon');

        // Если открыть ссылку как ar-promo.html?reset=1, память очистится
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('reset') === '1') {
            localStorage.removeItem('aw_prize');
            localStorage.removeItem('aw_promocode');
            localStorage.removeItem('aw_timestamp');
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        document.addEventListener('DOMContentLoaded', () => {
            const savedPrize = localStorage.getItem('aw_prize');
            const savedCode = localStorage.getItem('aw_promocode');
            const savedTime = localStorage.getItem('aw_timestamp');
            
            if (savedPrize && savedCode && savedTime) {
                const now = new Date().getTime();
                // Вычисляем, сколько часов прошло с момента выигрыша
                const hoursPassed = (now - parseInt(savedTime)) / (1000 * 60 * 60);

                if (hoursPassed < 24) {
                    // Прошло меньше времени — показываем старую скидку
                    shootBtn.style.display = 'none';
                    weapon.style.display = 'none';
                    prizeText.innerHTML = `${savedPrize}<br><span class="text-2xl text-white mt-2 block">Код: ${savedCode}</span>`;
                    resultPopup.classList.remove('hidden');
                } else {
                    // Прошло больше 24 часов — удаляем старое, даем крутить заново
                    localStorage.removeItem('aw_prize');
                    localStorage.removeItem('aw_promocode');
                    localStorage.removeItem('aw_timestamp');
                }
            }
        });

        // Генератор промокода
        function generatePromoCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'AW-';
            for (let i = 0; i < 5; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        shootBtn.addEventListener('click', () => {
            weapon.style.transform = "translateX(-40%) translateY(40px) rotate(-10deg)";
            shootBtn.style.display = 'none';

            const currentRot = roulette.getAttribute('rotation');
            const z = currentRot.z; 

            roulette.removeAttribute('animation');

            let deg = Math.abs(z % 360);
            let prize = "";

            if (deg >= 315 || deg < 45) {
                prize = "500"; 
            } else if (deg >= 45 && deg < 135) {
                prize = "20%"; 
            } else if (deg >= 135 && deg < 225) {
                prize = "5%";   
            } else if (deg >= 225 && deg < 315) {
                prize = "15%";  
            }

            const promoCode = generatePromoCode();
            const currentTime = new Date().getTime();

            localStorage.setItem('aw_prize', prize);
            localStorage.setItem('aw_promocode', promoCode);
            localStorage.setItem('aw_timestamp', currentTime.toString());

            // Отправка в Google Таблицу
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxBtiJiV_H5gaRGFJeD9d9ZeTDv1vFhCym-B0BivdHF6jfUHjfm26raEABXz1B161Wi/exec';
            
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify({
                    code: promoCode,
                    discount: prize
                })
            }).catch(err => console.error('Ошибка записи:', err));

            prizeText.innerHTML = `${prize}<br><span class="text-2xl text-white mt-2 block">Код: ${promoCode}</span>`;

            setTimeout(() => {
                weapon.style.display = 'none';
                resultPopup.classList.remove('hidden');
            }, 1000);
        });
    </script>
</body>
</html>
